<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Crear cuenta nueva · VitalHogar</title>
  <meta name="description" content="Crea tu cuenta de VitalHogar como paciente o como cuidador.">
  <script src="preferencias.js"></script>
  <link rel="stylesheet" href="estilos.css">
</head>
<!-- data-pagina="login": comun.js no redirige aquí aunque la sesión esté cerrada -->
<body data-pagina="login">
  <!-- Enlace para saltar la navegación con el teclado (WCAG 2.4.1) -->
  <a class="saltar" href="#contenido">Saltar al contenido principal</a>

  <div class="app">
    <main class="contenido" id="contenido" tabindex="-1">
      <div class="login-layout registro-layout">
        <!-- Logo de VitalHogar con su degradado verde azulado → azul -->
        <div class="login-marca">
          <svg class="logo-grande" viewBox="0 0 54 50" role="img" aria-label="Logo de VitalHogar" focusable="false">
            <defs>
              <linearGradient id="degradado-logo" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" class="logo-color-1"/>
                <stop offset="1" class="logo-color-2"/>
              </linearGradient>
            </defs>
            <g stroke="url(#degradado-logo)">
              <path d="M8 23v24h8.5c3.5 0 6.5-1 9.5-3.5l9-9.5c2.5-3 3.5-6 3-8-1-4-6-5-9-2.5-1.5 1.5-2.5 3-3.5 4.5"/>
              <path d="M25.5 28c-1-1.5-2-3-3.5-4.5-3-2.5-8-1.5-9 2.5-.5 2 .5 5 3 8 2.5 2.8 5 5.3 7.5 7.3"/>
              <path d="M28.5 44c2.5 1.8 5.5 3 9 3h6V23"/>
              <path d="M1.5 28.5 25.5 6.5l24 22"/>
              <path d="M37.5 11.5a4.5 4.5 0 0 1 4.5 4.5M37.5 6.5a9.5 9.5 0 0 1 9.5 9.5M37.5 1.5A14.5 14.5 0 0 1 52 16"/>
            </g>
          </svg>
          <div>
            <p class="login-nombre">VitalHogar</p>
            <p class="login-lema">Para pacientes y cuidadores</p>
          </div>
        </div>

        <!-- Crear cuenta: datos → confirmar el correo con un código → cuenta creada -->
        <div class="login registro" id="registro">
          <a class="enlace-volver" id="registro-volver" href="index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>
            <span id="registro-volver-texto">Volver a iniciar sesión</span>
          </a>

          <h1 id="registro-titulo">Crear cuenta nueva</h1>

          <!-- Paso 1: datos de la cuenta -->
          <form class="form-nuevo" id="form-registro" data-paso="datos" novalidate>
            <div class="campo">
              <label for="reg-usuario">Nombre de usuario <span class="obligatorio" aria-hidden="true">*</span></label>
              <input id="reg-usuario" type="text" autocomplete="username" autocapitalize="none" aria-required="true"
                     aria-describedby="pista-reg-usuario error-reg-usuario">
              <p class="campo-pista" id="pista-reg-usuario">Sin espacios. Lo usarás para entrar.</p>
              <p class="campo-error" id="error-reg-usuario"></p>
            </div>

            <div class="campo">
              <label for="reg-correo">Correo electrónico <span class="obligatorio" aria-hidden="true">*</span></label>
              <input id="reg-correo" type="email" inputmode="email" autocomplete="email" autocapitalize="none" aria-required="true"
                     aria-describedby="pista-reg-correo error-reg-correo">
              <p class="campo-pista" id="pista-reg-correo">Te enviaremos un código para confirmarlo.</p>
              <p class="campo-error" id="error-reg-correo"></p>
            </div>

            <div class="campo">
              <label for="reg-telefono">Teléfono móvil <span class="obligatorio" aria-hidden="true">*</span></label>
              <div class="campo-tel">
                <span class="prefijo" aria-hidden="true">+34</span>
                <input id="reg-telefono" type="tel" inputmode="tel" autocomplete="tel-national" aria-required="true"
                       aria-describedby="pista-reg-telefono error-reg-telefono">
              </div>
              <p class="campo-pista" id="pista-reg-telefono">9 cifras, sin el +34.</p>
              <p class="campo-error" id="error-reg-telefono"></p>
            </div>

            <div class="campo">
            <fieldset class="opciones-perfil" id="reg-tipo" role="radiogroup" tabindex="-1" aria-required="true" aria-describedby="error-reg-tipo">
              <legend>¿Quién va a usar la cuenta? <span class="obligatorio" aria-hidden="true">*</span></legend>
              <label class="opcion-perfil">
                <input type="radio" name="tipo" value="paciente">
                <span>
                  <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <circle cx="24" cy="17" r="8"/>
                    <path d="M8 42c2-10 9-14 16-14s14 4 16 14"/>
                  </svg>
                  <span class="opcion-texto">Paciente</span>
                </span>
              </label>
              <label class="opcion-perfil">
                <input type="radio" name="tipo" value="cuidador">
                <span>
                  <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <circle cx="24" cy="19" r="7"/>
                    <path d="M15 13c3-5 15-5 18 0l-2 3H17z"/>
                    <path d="M8 43c2-10 9-14 16-14s14 4 16 14"/>
                    <path d="M24 33v6M21 36h6"/>
                  </svg>
                  <span class="opcion-texto">Cuidador</span>
                </span>
              </label>
            </fieldset>
            <p class="campo-error" id="error-reg-tipo"></p>
            </div>

            <div class="campo">
              <label for="reg-clave">Contraseña <span class="obligatorio" aria-hidden="true">*</span></label>
              <div class="campo-clave">
                <input id="reg-clave" type="password" autocomplete="new-password" aria-required="true"
                       aria-describedby="pista-reg-clave error-reg-clave">
                <button class="boton btn-editar" type="button" data-ver-clave="reg-clave" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="ojo-tachado" d="M4 4l16 16" hidden/>
                  </svg>
                  <span class="ver-clave-texto">Mostrar</span>
                  <span class="sr-only">la contraseña</span>
                </button>
              </div>
              <p class="campo-pista" id="pista-reg-clave">Al menos 6 caracteres.</p>
              <p class="campo-error" id="error-reg-clave"></p>
            </div>

            <div class="campo">
              <label for="reg-clave2">Repite la contraseña <span class="obligatorio" aria-hidden="true">*</span></label>
              <div class="campo-clave">
                <input id="reg-clave2" type="password" autocomplete="new-password" aria-required="true"
                       aria-describedby="error-reg-clave2">
                <button class="boton btn-editar" type="button" data-ver-clave="reg-clave2" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="ojo-tachado" d="M4 4l16 16" hidden/>
                  </svg>
                  <span class="ver-clave-texto">Mostrar</span>
                  <span class="sr-only">la contraseña repetida</span>
                </button>
              </div>
              <p class="campo-error" id="error-reg-clave2"></p>
            </div>

            <div class="dialogo-botones">
              <button class="boton btn-confirmar" type="submit">Continuar</button>
            </div>
          </form>

          <!-- Paso 2: código recibido por correo -->
          <form class="form-nuevo" id="form-verificar" data-paso="correo" novalidate hidden>
            <p class="form-texto" id="verificar-texto"></p>

            <div class="campo">
              <label for="ver-codigo">Código del correo <span class="obligatorio" aria-hidden="true">*</span></label>
              <input id="ver-codigo" class="input-codigo" type="text" inputmode="numeric" autocomplete="one-time-code"
                     maxlength="7" aria-required="true" aria-describedby="verificar-texto error-ver-codigo">
              <p class="campo-error" id="error-ver-codigo"></p>
            </div>

            <div class="dialogo-botones">
              <button class="boton" type="button" id="registro-reenviar">Reenviar correo</button>
              <button class="boton btn-confirmar" type="submit">Verificar</button>
            </div>
          </form>

          <!-- Fin: cuenta creada -->
          <div class="paso-fin" data-paso="fin" hidden>
            <span class="icono-ok" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="m5 12 5 5 9-10"/></svg>
            </span>
            <p id="registro-fin-texto"></p>
            <button class="boton btn-confirmar btn-entrar" type="button" id="registro-entrar"
                    aria-describedby="registro-fin-texto">Entrar</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Región que lee el lector de pantalla cuando algo cambia (WCAG 4.1.3) -->
  <p class="sr-only" id="anuncio" aria-live="polite"></p>

  <script src="comun.js"></script>
  <script src="cuentas.js"></script>
  <script>
    const registro = document.getElementById("registro");
    const regTelefono = document.getElementById("reg-telefono");
    const volver = document.getElementById("registro-volver");
    const volverTexto = document.getElementById("registro-volver-texto");
    let nuevaCuenta = null;   // datos del paso 1, a la espera de verificar el teléfono
    let codigoRegistro = null;
    let cuentaCreada = false;
    let pasoActual = "datos";

    function irAPaso(paso) {
      pasoActual = paso;
      mostrarPaso(registro, paso);
      volver.hidden = paso === "fin";
      volverTexto.textContent = paso === "correo" ? "Volver a mis datos" : "Volver a iniciar sesión";
      const titulo = paso === "fin" ? "Cuenta creada" : "Crear cuenta nueva";
      document.getElementById("registro-titulo").textContent = titulo;
      document.title = `${titulo} · VitalHogar`;
    }

    // ---------- Retroceder ----------
    // Cada paso es una entrada del historial: el botón Atrás del navegador y el enlace
    // "Volver" hacen lo mismo. Al volver a los datos, lo escrito sigue en el formulario.
    volver.addEventListener("click", e => {
      if (pasoActual !== "correo") return; // en el primer paso, el enlace lleva al inicio de sesión
      e.preventDefault();
      history.back();
    });

    window.addEventListener("popstate", e => {
      // La cuenta ya existe: no tiene sentido volver a rellenar el formulario
      if (cuentaCreada) {
        location.replace("index.html");
        return;
      }
      const paso = e.state?.paso === "correo" && nuevaCuenta ? "correo" : "datos";
      irAPaso(paso);
    });

    // Al recargar se pierden los datos: se vuelve al primer paso sin dejar entradas de más
    if (history.state?.paso === "correo") history.back();
    if (history.state?.paso === "fin") location.replace("index.html");

    // ---------- Paso 1: datos ----------
    function pedirCodigoRegistro() {
      codigoRegistro = CODIGO_CORREO;
      // El correo lo escribe la persona: se pone como texto, nunca como HTML
      const correo = document.createElement("strong");
      correo.textContent = nuevaCuenta.correo;
      document.getElementById("verificar-texto").replaceChildren(
        "Hemos enviado un código a ", correo, ". Escríbelo aquí.");
    }

    document.getElementById("form-registro").addEventListener("submit", e => {
      e.preventDefault();
      const correo = normalizar(document.getElementById("reg-correo").value);
      const usuario = normalizar(document.getElementById("reg-usuario").value);
      const telefono = soloCifras(regTelefono.value);
      const clave = document.getElementById("reg-clave").value;
      const clave2 = document.getElementById("reg-clave2").value;
      const tipo = new FormData(e.target).get("tipo");

      const ok = comprobar([
        ["reg-usuario", !usuario ? "Escribe un nombre de usuario"
          : !/^[a-z0-9._ñ-]{3,}$/.test(usuario) ? "Usa al menos 3 letras o números, sin espacios"
          : usuarios[usuario] ? "Ese nombre de usuario ya existe. Prueba con otro" : ""],
        ["reg-correo", !correo ? "Escribe tu correo electrónico"
          : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo) ? "Escribe un correo válido, como nombre@gmail.com"
          : Object.values(usuarios).some(u => u.correo === correo) ? "Ya hay una cuenta con ese correo" : ""],
        ["reg-telefono", !telefono ? "Escribe tu teléfono móvil"
          : !/^[67]\d{8}$/.test(telefono) ? "Escribe un móvil de 9 cifras que empiece por 6 o 7" : ""],
        ["reg-tipo", tipo ? "" : "Elige quién va a usar la cuenta"],
        ["reg-clave", errorClave(clave)],
        ["reg-clave2", errorRepetir(clave2, clave)]
      ]);
      if (!ok) return;

      // Ya no se pide el nombre: la aplicación muestra el de usuario
      nuevaCuenta = { usuario, nombre: usuario, correo, telefono, clave, tipo };
      pedirCodigoRegistro();
      document.getElementById("form-verificar").reset();
      limpiarErrores(document.getElementById("form-verificar"));
      history.pushState({ paso: "correo" }, "");
      irAPaso("correo");
    });

    // Al corregir un campo marcado en rojo, su aviso desaparece sin esperar a "Continuar"
    document.getElementById("form-registro").addEventListener("input", e => {
      const campo = e.target.type === "radio" ? document.getElementById("reg-tipo") : e.target;
      if (campo.getAttribute("aria-invalid") !== "true") return;
      campo.removeAttribute("aria-invalid");
      document.getElementById("error-" + campo.id).textContent = "";
    });

    // ---------- Paso 2: código del correo ----------
    document.getElementById("registro-reenviar").addEventListener("click", () => {
      pedirCodigoRegistro();
      anunciar("Te hemos enviado un correo nuevo");
    });

    document.getElementById("form-verificar").addEventListener("submit", e => {
      e.preventDefault();
      const codigo = document.getElementById("ver-codigo").value.replace(/\s/g, "");
      const ok = comprobar([
        ["ver-codigo", !codigo ? "Escribe el código que te ha llegado por correo"
          : codigo !== codigoRegistro ? "El código no es correcto. Revisa el correo o pide uno nuevo" : ""]
      ]);
      if (!ok) return;

      const { usuario, ...datos } = nuevaCuenta;
      usuarios[usuario] = datos;
      guardarUsuarios();
      // El perfil del paciente empieza con su nombre y su teléfono
      if (datos.tipo === "paciente") {
        let perfil = {};
        try { perfil = JSON.parse(localStorage.getItem("perfil")) || {}; } catch (e) {}
        try { localStorage.setItem("perfil", JSON.stringify({ ...perfil, nombre: datos.nombre, telefono: datos.telefono })); } catch (e) {}
      }
      document.getElementById("registro-fin-texto").textContent =
        `Correo confirmado. Tu cuenta de ${datos.tipo} está lista, ${datos.nombre}.`;
      cuentaCreada = true;
      history.replaceState({ paso: "fin" }, "");
      irAPaso("fin");
      anunciar("Cuenta creada");
    });

    document.getElementById("registro-entrar").addEventListener("click", () => entrar(nuevaCuenta.usuario));
  </script>
</body>
</html>
