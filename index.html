<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Mi Hogar</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">

    <!-- Barra lateral de navegación -->
    <aside class="sidebar">
      <a href="#" class="logo" aria-label="Inicio">
        <span class="logo-texto">Logo</span>
        <span class="nav-texto">Inicio</span>
      </a>

      <nav class="nav" aria-label="Menú principal">
        <a href="#" class="nav-item">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="16" width="36" height="16" rx="8" transform="rotate(-35 24 24)"/>
            <line x1="20" y1="14" x2="28" y2="34" transform="rotate(-35 24 24)"/>
          </svg>
          <span class="nav-texto">Medicación</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <polyline points="6,24 24,8 42,24"/>
            <rect x="13" y="22" width="22" height="18"/>
          </svg>
          <span class="nav-texto">Casa</span>
        </a>
      </nav>

      <button class="btn-sos" type="button" aria-label="Llamada de emergencia SOS">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <polygon points="24,6 44,40 4,40"/>
          <line x1="24" y1="18" x2="24" y2="29"/>
          <circle cx="24" cy="34" r="1.5"/>
        </svg>
        <span>SOS</span>
      </button>
    </aside>

    <!-- Contenido principal -->
    <main class="contenido">
      <header class="cabecera">
        <h1>Buenos días, X</h1>
        <div class="perfiles">
          <button class="avatar" type="button" aria-label="Perfil de usuario">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="17" r="8"/>
              <path d="M8 42c2-10 9-14 16-14s14 4 16 14"/>
            </svg>
          </button>
          <button class="avatar" type="button" aria-label="Ajustes">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="7"/>
              <path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M10 38l4-4M34 14l4-4"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="aviso" role="alert">
        <span class="icono-aviso" aria-hidden="true">⚠</span>
        Medicación Pendiente
      </div>

      <!-- Estado de la casa -->
      <section class="tarjetas" aria-label="Estado de la casa">
        <article class="tarjeta">
          <h2>Luces</h2>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="20" r="10"/>
            <path d="M19 30v6h10v-6"/>
            <path d="M24 3v4M8 8l3 3M40 8l-3 3M3 20h4M41 20h4"/>
          </svg>
          <span class="estado ok">Encendidas</span>
        </article>

        <article class="tarjeta">
          <h2>Temperatura</h2>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M20 8a4 4 0 0 1 8 0v20a8 8 0 1 1-8 0z"/>
            <line x1="24" y1="16" x2="24" y2="32"/>
          </svg>
          <span class="estado alerta">30 °C</span>
        </article>

        <article class="tarjeta">
          <h2>Puertas</h2>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="4" width="24" height="40" rx="2"/>
            <circle cx="30" cy="25" r="1.8"/>
          </svg>
          <span class="estado alerta">Abiertas</span>
        </article>

        <article class="tarjeta">
          <h2>Ventanas</h2>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="8" y="6" width="32" height="36"/>
            <line x1="24" y1="6" x2="24" y2="42"/>
            <line x1="8" y1="24" x2="40" y2="24"/>
          </svg>
          <span class="estado ok">Cerradas</span>
        </article>
      </section>

      <!-- Próxima medicación -->
      <section class="medicacion" aria-label="Próxima medicación">
        <p class="hora">21:00</p>
        <p class="pastilla">Pastilla<br>tensión</p>
        <button class="btn-pendiente" type="button">
          Pendiente <span aria-hidden="true">⚠</span>
        </button>
      </section>
    </main>

  </div>
</body>
</html>
