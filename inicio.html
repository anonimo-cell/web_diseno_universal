<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio · VitalHogar</title>
  <meta name="description" content="Panel de control del hogar: estado de la casa, medicación y botón de emergencia.">
  <script src="preferencias.js"></script>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Enlace para saltar la navegación con el teclado (WCAG 2.4.1) -->
  <a class="saltar" href="#contenido">Saltar al contenido principal</a>

  <div class="app">

    <!-- ===== Barra lateral ===== -->
    <aside class="sidebar" aria-label="Navegación y emergencias">
      <nav aria-label="Menú principal">
        <ul class="nav">
          <!-- aria-current marca la página activa: sombreada y en negrita -->
          <li>
            <a href="#contenido" class="nav-item" aria-current="page">
              <!-- Isotipo de VitalHogar: casa con corazón y señal wifi -->
              <svg class="logo" viewBox="0 0 54 50" role="img" aria-label="Logo de VitalHogar" focusable="false">
                <path d="M8 23v24h8.5c3.5 0 6.5-1 9.5-3.5l9-9.5c2.5-3 3.5-6 3-8-1-4-6-5-9-2.5-1.5 1.5-2.5 3-3.5 4.5"/>
                <path d="M25.5 28c-1-1.5-2-3-3.5-4.5-3-2.5-8-1.5-9 2.5-.5 2 .5 5 3 8 2.5 2.8 5 5.3 7.5 7.3"/>
                <path d="M28.5 44c2.5 1.8 5.5 3 9 3h6V23"/>
                <path d="M1.5 28.5 25.5 6.5l24 22"/>
                <path d="M37.5 11.5a4.5 4.5 0 0 1 4.5 4.5M37.5 6.5a9.5 9.5 0 0 1 9.5 9.5M37.5 1.5A14.5 14.5 0 0 1 52 16"/>
              </svg>
              <span class="nav-texto">Inicio</span>
            </a>
          </li>
          <li>
            <a href="medicacion.html" class="nav-item">
              <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <rect x="6" y="16" width="36" height="16" rx="8" transform="rotate(-35 24 24)"/>
                <line x1="24" y1="16" x2="24" y2="32" transform="rotate(-35 24 24)"/>
              </svg>
              <span class="nav-texto">Medicación</span>
            </a>
          </li>
          <li>
            <a href="casa.html" class="nav-item">
              <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <polyline points="6,24 24,8 42,24"/>
                <rect x="13" y="22" width="22" height="18"/>
              </svg>
              <span class="nav-texto">Casa</span>
            </a>
          </li>
        </ul>
      </nav>

      <button class="boton btn-sos" type="button" id="abrir-sos" aria-haspopup="dialog">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <polygon points="24,5 45,41 3,41"/>
          <line x1="24" y1="18" x2="24" y2="29"/>
          <circle cx="24" cy="35" r="1.5"/>
        </svg>
        <span class="sos-texto">SOS</span>
        <span class="sr-only">: pedir ayuda</span>
      </button>
    </aside>

    <!-- ===== Contenido principal ===== -->
    <main class="contenido" id="contenido" tabindex="-1">
      <header class="cabecera">
        <h1 id="saludo">Buenos días</h1>
        <div class="perfiles">
          <a class="boton avatar" href="perfil.html" aria-label="Mi perfil" title="Mi perfil">
            <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
              <circle cx="24" cy="17" r="8"/>
              <path d="M8 42c2-10 9-14 16-14s14 4 16 14"/>
            </svg>
          </a>
        </div>
      </header>

      <!-- Solo lo esencial: la medicación de hoy, llamar a un familiar y ver la casa.
           La supervisión y la gestión están en la aplicación del cuidador. -->
      <!-- Próxima medicación: toda la tarjeta lleva a Mi medicación; el botón Pendiente va aparte -->
      <section class="medicacion" id="medicacion" aria-labelledby="titulo-med" tabindex="-1">
        <h2 id="titulo-med" class="sr-only">Próxima medicación</h2>
        <p class="hora"><time datetime="21:00">21:00</time></p>
        <p class="pastilla">
          <a class="med-enlace" href="medicacion.html">Pastilla tensión<span class="sr-only">: ver mi medicación</span></a>
        </p>
        <button class="boton btn-pendiente" type="button" id="btn-pastilla">
          <span class="btn-principal">Pendiente</span>
          <span class="btn-secundario">Pulsa al tomarla</span>
        </button>
      </section>

      <div class="inicio-acciones">
        <!-- Con familiar vinculado llama directamente; si no, lleva a los contactos -->
        <a class="boton btn-llamar accion-grande" id="llamar-familiar" href="perfil.html#contactos">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M13 6h7l3 9-5 3a24 24 0 0 0 12 12l3-5 9 3v7a4 4 0 0 1-4 4C21 39 9 27 9 10a4 4 0 0 1 4-4z"/></svg>
          <span id="llamar-texto">Mis contactos</span>
        </a>
        <a class="boton accion-grande" href="casa.html">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <polyline points="6,24 24,8 42,24"/>
            <rect x="13" y="22" width="22" height="18"/>
          </svg>
          Mi casa
          <span class="sr-only">:</span>
          <span class="estado" id="estado-casa"></span>
        </a>
      </div>
    </main>
  </div>

  <!-- Región que lee el lector de pantalla cuando algo cambia (WCAG 4.1.3) -->
  <p class="sr-only" id="anuncio" aria-live="polite"></p>

  <!-- ===== Ventana SOS: fondo difuminado, círculo rojo y cuenta atrás de 5 s con Cancelar y Avisar ahora
       (WCAG 3.3.4: se puede deshacer una activación por error) ===== -->
  <dialog class="dialogo-sos" id="dialogo-sos" aria-labelledby="sos-titulo">
    <h2 id="sos-titulo" class="sr-only">Llamada de emergencia</h2>

    <!-- Solo aparece cuando ya se está avisando -->
    <button class="boton btn-cerrar" type="button" id="sos-cerrar" aria-label="Cerrar" title="Cerrar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>

    <div class="sos-circulo" aria-hidden="true">
      <svg viewBox="0 0 48 48" focusable="false">
        <polygon points="24,5 45,41 3,41"/>
        <line x1="24" y1="18" x2="24" y2="29"/>
        <circle cx="24" cy="35" r="1.5"/>
      </svg>
      <span>SOS</span>
    </div>

    <!-- Cancelar lleva el foco: es la opción segura si se ha pulsado sin querer -->
    <div class="sos-acciones">
      <button class="boton btn-cancelar-sos" type="button" id="sos-cancelar">
        Cancelar (<span id="sos-cuenta">5</span>)
      </button>
      <button class="boton btn-sos-ahora" type="button" id="sos-ahora">Avisar ahora</button>
    </div>

    <!-- Mensaje de estado (WCAG 4.1.3): se rellena al avisar -->
    <p class="sos-estado" id="sos-estado" role="status"></p>
    <p class="sr-only" id="sos-aviso" aria-live="assertive"></p>
  </dialog>

  <script src="comun.js"></script>
  <script>
    // ---------- Saludo con el nombre de quien ha entrado ----------
    let nombreUsuario = "";
    try { nombreUsuario = sessionStorage.getItem("nombre-usuario") || ""; } catch (e) {}
    if (nombreUsuario) {
      document.getElementById("saludo").textContent = `Buenos días, ${nombreUsuario.split(" ")[0]}`;
    }

    // ---------- Llamar al familiar vinculado ----------
    const familiar = leerFamiliares()[0];
    if (familiar) {
      const llamarFamiliar = document.getElementById("llamar-familiar");
      llamarFamiliar.href = `tel:+34${familiar.telefono}`;
      document.getElementById("llamar-texto").textContent = `Llamar a ${familiar.nombre.split(" ")[0]}`;
    }

    // ---------- Mi casa: resumen de lo que hay en la página Casa ----------
    // "Todo cerrado" en verde o, si algo está abierto, cuántas puertas y ventanas en rojo.
    function pintarResumenCasa() {
      const dispositivos = leerDispositivos();
      const abiertas = tipo => dispositivos.filter(d => d.tipo === tipo && d.activo).length;
      const partes = [];
      if (abiertas("puerta")) partes.push(`${abiertas("puerta")} ${abiertas("puerta") === 1 ? "puerta" : "puertas"}`);
      if (abiertas("ventana")) partes.push(`${abiertas("ventana")} ${abiertas("ventana") === 1 ? "ventana" : "ventanas"}`);
      const total = abiertas("puerta") + abiertas("ventana");
      const estado = document.getElementById("estado-casa");
      estado.textContent = total ? `${partes.join(" y ")} ${total === 1 ? "abierta" : "abiertas"}` : "Todo cerrado";
      estado.className = "estado " + (total ? "alerta" : "ok");
    }
    pintarResumenCasa();
    // Al volver desde Casa con el botón Atrás la página puede venir de la caché: se repinta
    window.addEventListener("pageshow", pintarResumenCasa);

    // ---------- Medicación ----------
    configurarPastilla(document.getElementById("btn-pastilla"));
  </script>
</body>
</html>
